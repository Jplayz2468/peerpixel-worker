[project]
name = "peerpixel"
version = "0.1.0"
description = "Render FLUX.2 Klein for people whose machines cannot."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6",
  "diffusers>=0.39",
  "transformers>=4.57",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pillow>=10",
  "huggingface-hub>=0.30",
  "websockets>=13",
]

[project.scripts]
peerpixel = "peerpixel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
