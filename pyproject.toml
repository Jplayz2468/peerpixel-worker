[project]
name = "peerpixel"
version = "0.2.0"
description = "Render FLUX.2 Klein for people whose machines cannot."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6",
  "diffusers>=0.39",
  "transformers>=4.57",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pillow>=10",
  "huggingface-hub>=0.30",
  "websockets>=13",
]

[project.optional-dependencies]
# The native window. Installed by the launcher alongside the interpreter that
# runs the app, rather than into this environment, because the app has to be
# able to open before this environment exists. Here as well so that
# `uv run peerpixel app` from a clone gets a real window too.
window = ["pywebview>=5"]

[project.scripts]
peerpixel = "peerpixel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
# Explicit, so the interface files under peerpixel/ui travel with the package.
packages = ["peerpixel"]
