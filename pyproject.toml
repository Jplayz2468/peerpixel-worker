[project]
name = "peerpixel"
version = "0.14.12"
description = "Render FLUX.2 Klein for people whose machines cannot."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6",
  "diffusers>=0.39",
  "transformers>=4.57",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pillow>=10",
  "psutil>=6",
  "huggingface-hub>=0.30",
  "websockets>=13",
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
  "mlx-gen>=0.30.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
peerpixel = "peerpixel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
# Explicit, so the interface files under peerpixel/ui travel with the package.
packages = ["peerpixel"]

[tool.hatch.build.targets.wheel.force-include]
"APACHE-2.0.txt" = "APACHE-2.0.txt"
"THIRD_PARTY_NOTICES.txt" = "THIRD_PARTY_NOTICES.txt"
